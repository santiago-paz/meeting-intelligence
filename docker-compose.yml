services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: meetings
      POSTGRES_PASSWORD: meetings
      POSTGRES_DB: meetings
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetings -d meetings"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
